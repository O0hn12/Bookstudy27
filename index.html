<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heroes Adventure 2026 System</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Segoe UI",sans-serif;background:#1d3b34;color:#1c2b27}
header{background:#1565c0;color:#fff;padding:18px;text-align:center;font-size:22px;font-weight:700;position:relative}
#out{position:absolute;left:12px;top:14px;font-size:13px;background:#0d47a1;color:#fff;border:0;padding:6px 12px;border-radius:6px;cursor:pointer}
#nav{display:flex;flex-wrap:wrap}#nav button{flex:1;min-width:90px;border:0;color:#fff;padding:16px 6px;font-size:16px;cursor:pointer;font-family:inherit;opacity:.8}
#nav button.on{opacity:1;box-shadow:inset 0 -5px #fff8}
main,#login{max-width:960px;margin:18px auto;background:#fffffff2;border-radius:14px;padding:20px}
#login{max-width:380px}h2{margin:0 0 14px;color:#2e7d32}h3{margin:18px 0 8px}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #cfd8dc;border-radius:10px;font-size:16px;font-family:inherit}
button.go{width:100%;padding:14px;border:0;border-radius:10px;background:#2e7d32;color:#fff;font-size:17px;cursor:pointer;margin-top:10px;font-family:inherit}
button.sm{padding:9px 14px;border:0;border-radius:8px;background:#1565c0;color:#fff;cursor:pointer;margin:4px 0 4px 6px;font-family:inherit}
button.sm.off{background:#90a4ae}button:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:15px}th,td{border:1px solid #dfe6e9;padding:7px;text-align:center}th{background:#e8f5e9}
td input{margin:0;padding:7px;width:70px;text-align:center}tfoot td,.tot{font-weight:700;background:#fff8e1}
.ac{position:relative}.ac .list{position:absolute;right:0;left:0;background:#fff;border:1px solid #cfd8dc;border-radius:10px;z-index:5;max-height:220px;overflow:auto}
.ac .list div{padding:10px;cursor:pointer}.ac .list div:hover{background:#e3f2fd}
.bal{font-size:22px;font-weight:700;color:#e65100;margin:10px 0}.gifts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gift{border:2px solid #ffcc80;border-radius:12px;padding:14px;text-align:center}.gift.no{border-color:#cfd8dc;color:#78909c}.hide{display:none}
.note{color:#546e7a;font-size:14px}.sc{overflow-x:auto}
</style></head><body>
<header>Heroes Adventure 2026 System<button id="out" class="hide">خروج</button></header>
<div id="login"><h2>تسجيل الدخول</h2><input id="em" type="email" placeholder="الإيميل" dir="ltr"><input id="pw" type="password" placeholder="كلمة السر" dir="ltr"><button class="go" id="lg">دخول</button><div id="err" style="color:#c62828"></div></div>
<div id="app" class="hide"><nav id="nav"></nav><main id="main"></main></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,collection,doc,getDoc,getDocs,setDoc,addDoc,query,where,runTransaction,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const cfg={apiKey:"AIzaSyBhqSK9t8OU5xx4hiEpS9iyQTu9LbX8WHI",authDomain:"heroes-27.firebaseapp.com",projectId:"heroes-27",appId:"1:615985162667:web:92940befac250aa3d8caee"};
const app=initializeApp(cfg),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache()});

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").replace(/[\u064B-\u0652]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").trim().toLowerCase();
const all=async(n,q)=>(await getDocs(q||collection(db,n))).docs.map(d=>({id:d.id,...d.data()}));
const by=(c,k,v)=>all(c,query(collection(db,c),where(k,"==",v)));
const S={role:"user",teams:[],kids:[],weeks:[],gifts:[]};
const F=[["attendance","الحضور",5],["book","الكتاب",5],["homework","الواجب",10],["interaction","التفاعل",10],["behavior","السلوك",10],["minus","المايِنص",10]];
const E={att:[0,1],hw:[2],act:[3,4,5]},T={att:"الحضور",hw:"الواجب",act:"التفاعل والسلوك والمايِنص"};
const n=v=>+v||0,tot=s=>n(s.attendance)+n(s.book)+n(s.homework)+n(s.interaction)+n(s.behavior)-n(s.minus);
const isA=()=>S.role==="admin";
const opts=(a,l,p)=>`<option value="">${p}</option>`+a.map(x=>`<option value="${x.id}">${esc(l(x))}</option>`).join("");
const tsel=id=>`<select id="${id}">${opts(S.teams,t=>t.name,"-- اختر الفرقة --")}</select>`;
const wsel=id=>`<select id="${id}">${opts(S.weeks,w=>"الأسبوع "+w.number+(w.date?" - "+w.date:""),"اختر الأسبوع")}</select>`;
const nbox=id=>`<div class="ac"><input id="${id}" placeholder="الاسم" autocomplete="off"><div class="list"></div></div>`;
function acInit(id,tid){const i=$("#"+id),l=i.nextElementSibling;
 i.oninput=()=>{i.dataset.id="";const t=$("#"+tid).value,q=norm(i.value);
  l.innerHTML=S.kids.filter(k=>k.teamId==t&&norm(k.name).includes(q)).slice(0,8).map(k=>`<div data-id="${k.id}">${esc(k.name)}</div>`).join("")};
 i.onfocus=i.oninput;i.onblur=()=>setTimeout(()=>l.innerHTML="",200);
 l.onclick=e=>{const d=e.target.dataset.id;if(d){i.value=e.target.textContent;i.dataset.id=d;l.innerHTML=""}}}
function pick(id,tid){const i=$("#"+id);let k=S.kids.find(x=>x.id==i.dataset.id);
 if(!k)k=S.kids.find(x=>x.teamId==$("#"+tid).value&&norm(x.name)==norm(i.value));
 if(!k)alert("اختر الفرقة وبعدين اسم الطفل من الاقتراحات");return k}
async function load(){[S.teams,S.kids,S.weeks,S.gifts]=await Promise.all(["teams","children","weeks","gifts"].map(c=>all(c)));
 S.teams.sort((a,b)=>a.name.localeCompare(b.name,"ar"));S.kids.sort((a,b)=>a.name.localeCompare(b.name,"ar"));
 S.weeks.sort((a,b)=>n(a.number)-n(b.number));S.gifts.sort((a,b)=>n(a.cost)-n(b.cost))}

const TABS=[["att","الحضور","#43a047"],["hw","الواجب","#fb8c00"],["act","التفاعل","#8e24aa"],["rep","الدرجات","#1e88e5"],["shop","المعرض","#e91e63"]];
function nav(){const t=[...TABS];if(isA())t.push(["adm","الإدارة","#455a64"]);
 $("#nav").innerHTML=t.map(x=>`<button data-k="${x[0]}" style="background:${x[2]}">${x[1]}</button>`).join("");
 $("#nav").onclick=e=>{const k=e.target.dataset.k;if(k)go(k)};go("att")}
function go(k){$$("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.k==k));
 ({att:entry,hw:entry,act:entry,rep:rep,shop:shop,adm:adm})[k](k)}

function entry(k){const f=E[k].map(i=>F[i]);let sc={};
 $("#main").innerHTML=`<h2>${T[k]}</h2>${tsel("t")}${wsel("w")}<input id="q" placeholder="بحث بالاسم داخل الفرقة"><div id="g" class="sc"></div><button class="go" id="sv">إدخال</button>
 <p class="note">${isA()?"":"الدرجة المسجلة مسبقًا مقفولة، والتعديل للأدمن فقط."}</p>`;
 const draw=async()=>{const t=$("#t").value,w=$("#w").value;if(!t||!w){$("#g").innerHTML="";return}
  sc={};(await by("scores","weekId",w)).forEach(s=>sc[s.childId]=s);
  $("#g").innerHTML=`<table><tr><th>الاسم</th>${f.map(x=>`<th>${x[1]} (0-${x[2]})</th>`).join("")}</tr>`+
   S.kids.filter(c=>c.teamId==t).map(c=>`<tr data-n="${esc(norm(c.name))}"><td>${esc(c.name)}</td>${f.map(x=>{const v=sc[c.id]?.[x[0]];
   return `<td><input type="number" min="0" max="${x[2]}" data-c="${c.id}" data-f="${x[0]}" value="${v??""}" ${v!=null&&!isA()?"disabled":""}></td>`}).join("")}</tr>`).join("")+`</table>`};
 $("#t").onchange=$("#w").onchange=draw;
 $("#q").oninput=()=>{const q=norm($("#q").value);$$("#g tr[data-n]").forEach(r=>r.classList.toggle("hide",!r.dataset.n.includes(q)))};
 $("#sv").onclick=async()=>{const t=$("#t").value,w=$("#w").value;if(!t||!w)return alert("اختر الفرقة والأسبوع");
  const m={};for(const i of $$("#g input:not(:disabled)")){if(i.value==="")continue;const v=+i.value;
   if(v<0||v>+i.max)return alert("الدرجة لازم تكون من 0 إلى "+i.max);(m[i.dataset.c]??={})[i.dataset.f]=v}
  const ids=Object.keys(m);if(!ids.length)return alert("مفيش درجات جديدة للحفظ");
  try{const b=writeBatch(db);ids.forEach(c=>b.set(doc(db,"scores",c+"_"+w),{childId:c,weekId:w,teamId:t,...m[c]},{merge:true}));
   await b.commit();alert("تم الحفظ لعدد "+ids.length+" طفل");draw()}catch(e){alert("حصلت مشكلة: "+e.message)}}}

function rep(_,mode="c"){
 $("#main").innerHTML=`<h2>الدرجات</h2>${[["c","تقرير طفل"],["t","درجات الفرقة"],["w","حضور أسبوع"]].map(x=>`<button class="sm ${x[0]==mode?"":"off"}" data-m="${x[0]}">${x[1]}</button>`).join("")}
 ${tsel("t")}${mode=="c"?nbox("nm"):wsel("w")}<button class="go" id="s">بحث</button><div id="r" class="sc"></div>`;
 $$("[data-m]").forEach(b=>b.onclick=()=>rep(0,b.dataset.m));if(mode=="c")acInit("nm","t");
 const head=`<th>${F.map(x=>x[1]).join("</th><th>")}</th><th>المجموع</th>`;
 $("#s").onclick=async()=>{const t=$("#t").value;if(!t)return alert("اختر الفرقة");const r=$("#r");
  if(mode=="c"){const k=pick("nm","t");if(!k)return;const ss=await by("scores","childId",k.id),m={};ss.forEach(s=>m[s.weekId]=s);
   const ws=S.weeks.filter(w=>m[w.id]),sum=F.map(x=>ws.reduce((a,w)=>a+n(m[w.id][x[0]]),0));
   r.innerHTML=`<h3>${esc(k.name)}</h3><table><tr><th>الأسبوع</th>${head}</tr>`+ws.map(w=>`<tr><td>${w.number}</td>${F.map(x=>`<td>${isA()?`<input type="number" min="0" max="${x[2]}" data-w="${w.id}" data-f="${x[0]}" value="${m[w.id][x[0]]??""}">`:n(m[w.id][x[0]])}</td>`).join("")}<td class="tot">${tot(m[w.id])}</td></tr>`).join("")+
   `<tfoot><tr><td>المجموع</td>${sum.map((v,i)=>`<td>${i==5?-v:v}</td>`).join("")}<td>${sum[0]+sum[1]+sum[2]+sum[3]+sum[4]-sum[5]}</td></tr></tfoot></table>`+(ws.length?"":"<p>مفيش درجات مسجلة للطفل ده.</p>")+(isA()&&ws.length?`<button class="go" id="ed">حفظ التعديلات</button>`:"");
   if($("#ed"))$("#ed").onclick=async()=>{const u={};for(const i of $$("#r input")){if(i.value==="")continue;const v=+i.value;if(v<0||v>+i.max)return alert("درجة خارج المدى");(u[i.dataset.w]??={})[i.dataset.f]=v}
    const b=writeBatch(db);Object.keys(u).forEach(w=>b.set(doc(db,"scores",k.id+"_"+w),u[w],{merge:true}));await b.commit();alert("تم التعديل");$("#s").click()}}
  else if(mode=="t"){const ss=await by("scores","teamId",t),ks=S.kids.filter(c=>c.teamId==t);
   r.innerHTML=`<table><tr><th>الاسم</th>${head}<th>الرصيد</th></tr>`+ks.map(c=>{const a=ss.filter(s=>s.childId==c.id),v=F.map(x=>a.reduce((s,z)=>s+n(z[x[0]]),0)),T=v[0]+v[1]+v[2]+v[3]+v[4]-v[5];
    return `<tr><td>${esc(c.name)}</td>${v.map(x=>`<td>${x}</td>`).join("")}<td class="tot">${T}</td><td>${T-n(c.spent)}</td></tr>`}).join("")+`</table>`}
  else{const w=$("#w").value;if(!w)return alert("اختر الأسبوع");const ss=await by("scores","weekId",w),ks=S.kids.filter(c=>c.teamId==t);
   const ok=ks.filter(c=>n(ss.find(s=>s.childId==c.id)?.attendance)>0);
   r.innerHTML=(isA()?`<p class="bal">عدد الحضور: ${ok.length} من ${ks.length}</p>`:"")+`<h3>الحاضرين</h3>`+(ok.length?"<ol>"+ok.map(c=>`<li>${esc(c.name)}</li>`).join("")+"</ol>":"<p>مفيش حضور مسجل.</p>")}}}

async function shop(){
 $("#main").innerHTML=`<h2>المعرض</h2>${tsel("t")}${nbox("nm")}<button class="go" id="s">بحث</button><div id="r"></div>`;acInit("nm","t");
 $("#s").onclick=async()=>{const k=pick("nm","t");if(!k)return;
  const earned=(await by("scores","childId",k.id)).reduce((a,s)=>a+tot(s),0),bal=earned-n(k.spent);
  $("#r").innerHTML=`<h3>${esc(k.name)}</h3><div class="bal">رصيد البوينتات: ${bal} <span class="note">(جمع ${earned} - صرف ${n(k.spent)})</span></div><div class="gifts">`+
   S.gifts.filter(g=>g.available!==false).map(g=>`<div class="gift ${g.cost>bal?"no":""}"><b>${esc(g.name)}</b><div>${g.cost} بوينت</div><button class="sm" data-g="${g.id}" ${g.cost>bal?"disabled":""}>شراء</button></div>`).join("")+`</div>`;
  $("#r").onclick=async e=>{const g=S.gifts.find(x=>x.id==e.target.dataset.g);if(!g||!confirm("شراء "+g.name+" بـ "+g.cost+" بوينت؟"))return;
   try{await runTransaction(db,async tx=>{const ref=doc(db,"children",k.id),sp=n((await tx.get(ref)).data().spent);
     if(earned-sp<g.cost)throw new Error("الرصيد مش كافي");tx.update(ref,{spent:sp+n(g.cost)});
     tx.set(doc(collection(db,"purchases")),{childId:k.id,giftId:g.id,giftName:g.name,cost:n(g.cost),date:new Date().toISOString()})});
    k.spent=n(k.spent)+n(g.cost);alert("تم الشراء");$("#s").click()}catch(er){alert(er.message)}}}}

function adm(){
 $("#main").innerHTML=`<h2>الإدارة</h2>
 <h3>إضافة فرقة</h3><input id="a1" placeholder="اسم الفرقة"><button class="go" id="b1">إضافة</button>
 <h3>إضافة أطفال (اسم في كل سطر)</h3>${tsel("a2")}<textarea id="a3" rows="5" placeholder="الأسماء"></textarea><button class="go" id="b2">إضافة</button>
 <h3>إضافة أسبوع</h3><input id="a4" type="number" placeholder="رقم الأسبوع"><input id="a5" type="date"><button class="go" id="b3">إضافة</button>
 <h3>إضافة هدية</h3><input id="a6" placeholder="اسم الهدية"><input id="a7" type="number" placeholder="عدد البوينتات"><button class="go" id="b4">إضافة</button>`;
 const run=async f=>{try{await f();await load();alert("تمت الإضافة");adm()}catch(e){alert("مشكلة: "+e.message)}};
 $("#b1").onclick=()=>$("#a1").value.trim()&&run(()=>addDoc(collection(db,"teams"),{name:$("#a1").value.trim()}));
 $("#b2").onclick=()=>{const t=$("#a2").value,ns=$("#a3").value.split("\n").map(x=>x.trim()).filter(Boolean);if(!t||!ns.length)return alert("اختر الفرقة واكتب الأسماء");
  run(async()=>{const b=writeBatch(db);ns.forEach(x=>b.set(doc(collection(db,"children")),{name:x,teamId:t,spent:0}));await b.commit()})};
 $("#b3").onclick=()=>$("#a4").value&&run(()=>addDoc(collection(db,"weeks"),{number:+$("#a4").value,date:$("#a5").value}));
 $("#b4").onclick=()=>$("#a6").value.trim()&&$("#a7").value&&run(()=>addDoc(collection(db,"gifts"),{name:$("#a6").value.trim(),cost:+$("#a7").value,available:true}))}

$("#lg").onclick=async()=>{$("#err").textContent="";try{await signInWithEmailAndPassword(auth,$("#em").value,$("#pw").value)}catch(e){$("#err").textContent="الإيميل أو كلمة السر غلط"}};
$("#out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{const on=!!u;$("#login").classList.toggle("hide",on);$("#app").classList.toggle("hide",!on);$("#out").classList.toggle("hide",!on);
 if(!on)return;S.role=(await getDoc(doc(db,"users",u.uid))).data()?.role||"user";await load();nav()});
</script></body></html>
