<script type="module">

const n=v=>+v||0,tot=s=>n(s.attendance)+n(s.book)+n(s.homework)+n(s.interaction)+n(s.behavior)-n(s.minus);

 i.oninput=()=>{i.dataset.id="";const t=$("#"+tid).value,q=norm(i.value);
  l.innerHTML=S.kids.filter(k=>k.teamId==t&&norm(k.name).includes(q)).slice(0,8).map(k=>`<div data-id="${k.id}">${esc(k.name)}</div>`).join("")};
 i.onfocus=i.oninput;i.onblur=()=>setTimeout(()=>l.innerHTML="",200);

 if(!k)alert("اختر الفرقة وبعدين اسم الطفل من الاقتراحات");return k}
async function load(){[S.kids,S.gifts,S.chars]=await Promise.all(["children","gifts","chars"].map(c=>all(c)));S.set=(await getDoc(doc(db,"settings","main"))).data()||{};S.teams=TEAMS;S.weeks=WEEKS.slice(0,n(S.set.weeks)||10);

 S.weeks.sort((a,b)=>n(a.number)-n(b.number));S.gifts.sort((a,b)=>n(a.cost)-n(b.cost))}

const TABS=[["att","✅ الحضور","#43a047"],["hw","📚 الواجب","#fb8c00"],["act","🔥 التفاعل","#8e24aa"],["rep","📊 الدرجات","#1e88e5"],["shop","🎁 المعرض","#e91e63"],["honor","🏆 الشرف","#f9a825"],["miss","📞 الافتقاد","#00897b"],["log","📜 المشتريات","#6d4c41"]];

 $("#nav").innerHTML=t.map(x=>`<button data-k="${x[0]}" style="background:${x[2]}">${x[1]}</button>`).join("");
 $("#nav").onclick=e=>{const k=e.target.dataset.k;if(k)go(k)};go("att")}

 $("#main").onclick=null;({att:entry,hw:entry,act:entry,rep:rep,shop:shop,adm:adm,ch:chadm,honor:honor,miss:miss,log:plog,st:stats})[k](k);const m=$("#main");m.classList.remove("in");void m.offsetWidth;m.classList.add("in")}

 mode=="f"?entryForm(k):find(k);
 const m=$("#main");m.querySelector("h2").insertAdjacentHTML("afterend",`<div>${[["f","✍️ تسجيل"],["s","🔍 بحث عن طفل"]].map(x=>`<button class="sm ${x[0]==mode?"":"off"}" data-e="${x[0]}">${x[1]}</button>`).join("")}</div>`);

function find(k){const f=E[k].map(i=>F[i]);
 $("#main").innerHTML=`<h2>${T[k]}</h2>${tsel("t")}${nbox("nm")}<button class="go" id="s">بحث</button><div id="r" class="sc"></div>`;acInit("nm","t");
 const cl=(v,x)=>v==null?"na":x[0]=="minus"?"":v/x[2]>=.8?"hi":v/x[2]>=.4?"mid":"lo";
 $("#s").onclick=async()=>{const c=pick("nm","t");if(!c)return;const m={};(await by("scores","childId",c.id)).forEach(s=>m[s.weekId]=s);
  const got=S.weeks.filter(w=>k=="att"?n(m[w.id]?.attendance)>0:f.some(x=>m[w.id]?.[x[0]]!=null)).length,sum=f.map(x=>S.weeks.reduce((a,w)=>a+n(m[w.id]?.[x[0]]),0));

 const draw=async()=>{const t=$("#t").value,w=$("#w").value;if(!t||!w){$("#g").innerHTML="";return}

 const ed=id=>{const c=S.kids.find(x=>x.id==id);$("#kl").insertAdjacentHTML("afterbegin",`<div class="ep"><input id="en" value="${esc(c.name)}"><input id="ep" placeholder="تليفون ولي الأمر" value="${esc(c.phone||"")}" dir="ltr">${tsel("et")}<button class="sm" id="es">حفظ التعديل</button></div>`);$("#et").value=c.teamId;
  $("#es").onclick=async()=>{const t=$("#et").value,b=writeBatch(db);b.set(doc(db,"children",id),{name:$("#en").value.trim()||c.name,phone:$("#ep").value.trim(),teamId:t},{merge:true});
   if(t!=c.teamId)(await by("scores","childId",id)).forEach(s=>b.set(doc(db,"scores",s.id),{teamId:t},{merge:true}));
   try{await b.commit();await load();alert("تم التعديل ✔");adm();$("#a2").value=t;$("#a2").onchange()}catch(er){alert("مشكلة: "+er.message)}}};
 $("#main").onclick=async e=>{const d=e.target.dataset.d,c2=e.target.closest("[data-e2]");if(!d&&c2)return ed(c2.dataset.e2);if(!d||!confirm("متأكد من الحذف؟"))return;
  try{await deleteDoc(doc(db,...d.split("/")));await load();lists()}catch(er){alert("مشكلة: "+er.message)}};
 const run=async f=>{const t=$("#a2").value;try{await f();await load();alert("تمت الإضافة ✔");adm();$("#a2").value=t;$("#a2").onchange()}catch(e){alert("مشكلة: "+e.message)}};
 $("#b2").onclick=()=>{const t=$("#a2").value;if(!t)return alert("اختر الفرقة أولًا");
  const have=new Set(S.kids.filter(c=>c.teamId==t).map(c=>norm(c.name))),ns=[...new Set($("#a3").value.split("\n").map(x=>x.trim()).filter(Boolean))].filter(x=>!have.has(norm(x.split(/[|\t]/)[0])));
  if(!ns.length)return alert("مفيش أسماء جديدة للإضافة");
  run(async()=>{for(let i=0;i<ns.length;i+=400){const b=writeBatch(db);ns.slice(i,i+400).forEach(x=>b.set(doc(collection(db,"children")),{name:x.split(/[|\t]/)[0].trim(),phone:(x.split(/[|\t]/)[1]||"").trim(),teamId:t,spent:0}));await b.commit()}})};
 $("#b4").onclick=()=>$("#a6").value.trim()&&$("#a7").value&&run(()=>addDoc(collection(db,"gifts"),{name:$("#a6").value.trim(),cost:+$("#a7").value,available:true}))}

$("#lg").onclick=async()=>{$("#err").textContent="";try{await signInWithEmailAndPassword(auth,$("#em").value,$("#pw").value)}catch(e){$("#err").textContent="الإيميل أو كلمة السر غلط"}};
$("#out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{const on=!!u;$("#login").classList.toggle("hide",on);$("#app").classList.toggle("hide",!on);$("#out").classList.toggle("hide",!on);
 if(!on)return;S.role=(await getDoc(doc(db,"users",u.uid))).data()?.role||"user";await load();nav()});
</script></body></html>
